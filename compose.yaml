x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    logging: *default-logging
    restart: unless-stopped
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env.development
    environment:
      APP_ENV: development
    # Original development database migrations are an explicit operator step.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=12).close()"]
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 30s

  api-test:
    logging: *default-logging
    restart: unless-stopped
    profiles: [test]
    build: .
    ports:
      - "127.0.0.1:8001:8000"
    env_file: .env.test
    environment:
      APP_ENV: test
    depends_on:
      db:
        condition: service_healthy
      migrate-test:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=12).close()"
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 30s

  migrate-test:
    logging: *default-logging
    profiles: [test]
    build: .
    env_file: .env.test
    environment:
      APP_ENV: test
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  migrate-development:
    logging: *default-logging
    profiles: [tools]
    build: .
    env_file: .env.development
    environment:
      APP_ENV: development
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"

  db:
    logging: *default-logging
    restart: unless-stopped
    profiles: [test]
    image: postgres:16
    environment:
      POSTGRES_DB: ecommerce_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
    # Preserve the existing Docker data regardless of the project name.
    external: true
    name: backend-improve_postgres_data
