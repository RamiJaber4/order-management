services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Local development credentials for the isolated Compose database.
      # Explicitly overrides any DATABASE_URL in the host's .env.
      DATABASE_URL: postgresql+psycopg://postgres:local_dev_password@db:5432/ecommerce_db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/products?limit=1', timeout=3).close()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ecommerce_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
