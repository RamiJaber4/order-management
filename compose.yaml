services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env.development
    environment:
      APP_ENV: development
    # Original development database migrations are an explicit operator step.
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api-test:
    profiles: [test]
    build: .
    ports:
      - "127.0.0.1:8001:8000"
    env_file: .env.test
    environment:
      APP_ENV: test
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    profiles: [test]
    image: postgres:16
    environment:
      POSTGRES_DB: ecommerce_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
    # Preserve the existing Docker data regardless of the project name.
    external: true
    name: backend-improve_postgres_data
